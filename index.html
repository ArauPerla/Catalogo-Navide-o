<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Catálogo Navideño 2026 | Letreros Neón</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 12px 22px}.viewer{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}.page{max-height:calc(100dvh - 115px);max-width:min(100%,800px);width:auto;height:auto;object-fit:contain;display:block}.nav{border:1px solid #465f20;background:#192a08;color:#a3ee20;border-radius:50%;height:45px;width:45px;font-size:27px;cursor:pointer;flex-shrink:0}.nav:disabled{opacity:.25;cursor:default}.controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;color:#b6e86a}.dots{display:flex;gap:9px}.dot{height:10px;width:10px;border:0;border-radius:50%;background:#4a4a4a;cursor:pointer;padding:0}.dot.active{background:#a3e51b}.count{min-width:48px;text-align:center;font-size:14px}button:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-width:650px){main{padding:8px 5px 15px}.viewer{gap:3px}.nav{width:30px;height:40px;border-radius:8px;font-size:22px}.page{max-width:calc(100vw - 75px);max-height:calc(100dvh - 92px)}} </style></head><body><main><div class="viewer"><button class="nav" id="prev" aria-label="Página anterior">&#8249;</button><img id="page" class="page" alt="Página 1 del catálogo navideño 2026"><button class="nav" id="next" aria-label="Página siguiente">&#8250;</button></div><div class="controls"><div class="dots" id="dots"></div><span class="count" id="count"></span></div></main><script>const pages=Array.from({length:5},(_,i)=>`Navidad 2026-0${i+1}.png`);let current=0;const img=document.getElementById('page'),dots=document.getElementById('dots');pages.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`Ir a página ${i+1}`);b.onclick=()=>show(i);dots.append(b)});function show(i){current=Math.max(0,Math.min(pages.length-1,i));img.src=encodeURI(pages[current]);img.alt=`Página ${current+1} de ${pages.length} del catálogo navideño 2026`;document.getElementById('count').textContent=`${current+1} / ${pages.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===pages.length-1;[...dots.children].forEach((b,j)=>b.classList.toggle('active',j===current))}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});let x=0;img.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});img.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-x;if(Math.abs(d)>45)show(current+(d<0?1:-1))},{passive:true});show(0);</script></body></html>
